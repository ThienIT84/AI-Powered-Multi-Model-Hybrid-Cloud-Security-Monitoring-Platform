name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Type check
      run: npm run build

    - name: Run tests
      run: npm run test -- --run --coverage

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image
      run: |
        docker build -t soc-dashboard:${{ github.sha }} .
        docker tag soc-dashboard:${{ github.sha }} soc-dashboard:latest

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      run: |
        docker tag soc-dashboard:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/soc-dashboard:${{ github.sha }}
        docker tag soc-dashboard:latest ${{ secrets.DOCKER_USERNAME }}/soc-dashboard:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/soc-dashboard:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/soc-dashboard:latest

    - name: Deploy to production
      run: |
        echo "Deployment commands would go here"
        echo "Example: kubectl set image deployment/soc-dashboard soc-dashboard=${{ secrets.DOCKER_USERNAME }}/soc-dashboard:${{ github.sha }}"
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
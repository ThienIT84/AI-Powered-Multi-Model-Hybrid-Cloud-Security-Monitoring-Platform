version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - soc-network
    restart: unless-stopped

  backend:
    # Replace with your actual backend image/service
    image: your-backend-image:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/soc_db
      - REDIS_URL=redis://redis:6379
      - AWS_REGION=us-east-1
      - AWS_SQS_QUEUE_URL=https://sqs.us-east-1.amazonaws.com/123456789012/soc-queue
    depends_on:
      - db
      - redis
    networks:
      - soc-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=soc_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - soc-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - soc-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - soc-network
    restart: unless-stopped

networks:
  soc-network:
    driver: bridge

volumes:
  postgres_data: